[project]
name = "mgas-ai-service"
version = "0.2.0"
description = "Media and AI worker for the Metadata Generator and Archival System"
requires-python = ">=3.12"
# Media/AI libraries are added in the phase that uses them. Phase 1: probing
# (ffprobe via subprocess + pymediainfo), OpenAI, prompts, retries.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.28,<1",
    "celery[redis]>=5.4,<6",
    "openai>=1.99",
    "tenacity>=9,<10",
    "jinja2>=3.1,<4",
    "pymediainfo>=6.1",
]

[project.optional-dependencies]
# Local transcription on the NVIDIA GPU (the default provider, see DECISIONS.md).
# The NVIDIA wheels provide cuBLAS + cuDNN 9 for CUDA 12, as faster-whisper's README asks.
local = ["faster-whisper>=1.1", "nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.*"]
dev = ["pytest>=8.3,<9", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The image's /srv is read-only for the app user.
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "pymediainfo.*", "faster_whisper.*"]
ignore_missing_imports = true

# Celery's @task decorator is untyped.
[[tool.mypy.overrides]]
module = ["app.worker", "app.pipeline.tasks", "app.pipeline.translation", "app.pipeline.files"]
disallow_untyped_decorators = false
