[project]
name = "mgas-ai-service"
version = "0.1.0"
description = "Media and AI worker for the Metadata Generator and Archival System"
requires-python = ">=3.12"
# Phase 0 core only. Media/AI libraries (ffmpeg-python, pymediainfo, openai,
# anthropic, tenacity, jinja2...) are added in the phase that uses them.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.28,<1",
    "celery[redis]>=5.4,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

# Celery's @task decorator is untyped.
[[tool.mypy.overrides]]
module = ["app.worker"]
disallow_untyped_decorators = false
