; Development settings for the optional Laravel containers (--profile docker-laravel).
; The project is bind-mounted from the Windows drive, where every file read is
; slow, so compiled scripts and resolved paths are cached aggressively.
; Changed PHP files are picked up within 60 s (or after `docker compose restart web`).

opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=60
opcache.memory_consumption=256
opcache.max_accelerated_files=50000
opcache.interned_strings_buffer=32
; Lets short-lived artisan commands reuse compiled scripts too.
opcache.file_cache=/tmp

realpath_cache_size=16M
realpath_cache_ttl=600

memory_limit=512M
upload_max_filesize=2048M
post_max_size=2048M
