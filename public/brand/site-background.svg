<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky-glow" cx="0.12" cy="0.08" r="0.55">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun-glow" cx="0.92" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#FACC15" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FACC15" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sky-glow-small" cx="0.85" cy="0.3" r="0.3">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#0F172A" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="dots-fade" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </radialGradient>
    <mask id="dots-mask">
      <rect width="1600" height="1000" fill="url(#dots-fade)"/>
    </mask>
    <pattern id="sprockets" width="44" height="18" patternUnits="userSpaceOnUse">
      <rect x="10" y="3" width="24" height="12" rx="3" fill="#0EA5E9" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <!-- Mist base and soft light -->
  <rect width="1600" height="1000" fill="#F4F8FA"/>
  <rect width="1600" height="1000" fill="url(#sky-glow)"/>
  <rect width="1600" height="1000" fill="url(#sky-glow-small)"/>
  <rect width="1600" height="1000" fill="url(#sun-glow)"/>

  <!-- Dot grid, strongest at the edges so the middle stays calm -->
  <rect width="1600" height="1000" fill="url(#dots)" mask="url(#dots-mask)"/>

  <!-- A film strip running across the top-right corner -->
  <g transform="translate(1040 -40) rotate(24)">
    <rect x="0" y="0" width="900" height="120" rx="10" fill="#0EA5E9" fill-opacity="0.05"/>
    <rect x="0" y="6" width="900" height="18" fill="url(#sprockets)"/>
    <rect x="0" y="96" width="900" height="18" fill="url(#sprockets)"/>
    <g fill="none" stroke="#0EA5E9" stroke-opacity="0.14" stroke-width="2">
      <rect x="20" y="32" width="150" height="56" rx="6"/>
      <rect x="190" y="32" width="150" height="56" rx="6"/>
      <rect x="360" y="32" width="150" height="56" rx="6"/>
      <rect x="530" y="32" width="150" height="56" rx="6"/>
      <rect x="700" y="32" width="150" height="56" rx="6"/>
    </g>
  </g>

  <!-- A second, fainter strip low on the left -->
  <g transform="translate(-160 820) rotate(-12)">
    <rect x="0" y="0" width="760" height="96" rx="10" fill="#FACC15" fill-opacity="0.07"/>
    <rect x="0" y="4" width="760" height="18" fill="url(#sprockets)" opacity="0.6"/>
    <rect x="0" y="74" width="760" height="18" fill="url(#sprockets)" opacity="0.6"/>
  </g>

  <!-- Audio waveform along the bottom: the transcript motif -->
  <path fill="none" stroke="#0EA5E9" stroke-opacity="0.16" stroke-width="2.5" stroke-linecap="round"
        d="M0 930 C 80 930, 110 900, 150 900 S 210 955, 260 955 S 320 885, 370 885 S 440 960, 500 960 S 560 905, 620 905 S 690 945, 760 945 S 830 875, 900 875 S 980 950, 1050 950 S 1120 910, 1190 910 S 1260 940, 1330 940 S 1410 895, 1480 895 S 1560 925, 1600 925"/>
  <path fill="none" stroke="#FACC15" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round"
        d="M0 950 C 90 950, 130 925, 180 925 S 250 965, 310 965 S 380 915, 440 915 S 520 970, 590 970 S 660 930, 730 930 S 800 960, 870 960 S 950 905, 1020 905 S 1100 965, 1170 965 S 1250 930, 1320 930 S 1400 955, 1470 955 S 1550 935, 1600 935"/>
</svg>
