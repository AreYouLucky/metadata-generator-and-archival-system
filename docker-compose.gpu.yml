# NVIDIA GPU for local Whisper (Phase 1) and later pyannote / YOLO.
# docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Needs a current NVIDIA driver and Docker Desktop's WSL2 GPU support.
services:
    ai-worker-gpu:
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
